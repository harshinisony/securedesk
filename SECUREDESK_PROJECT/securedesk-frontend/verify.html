<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Verification — SecureDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=2026.8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23059669%27 stroke-width=%272.5%27%3E%3Cpath d=%27M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5%27/%3E%3C/svg%3E" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card" style="text-align:center;">
      <div class="auth-brand-center">
        <div class="brand-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-title-wrap">
          <span class="brand-name" style="font-size:1.35rem;">SecureDesk</span>
          <span class="brand-sub">SOC 2026</span>
        </div>
      </div>

      <div id="loading" style="padding:1.5rem 0;">
        <div class="spinner" style="width:30px;height:30px;border-width:2.5px;margin-bottom:1.2rem;"></div>
        <h2>Verifying Security Token…</h2>
        <p class="lead">Validating credentials and activating account.</p>
      </div>

      <div id="result" class="hidden" style="padding:1.2rem 0;">
        <h1 id="result-title" style="margin-bottom:0.6rem;"></h1>
        <p class="lead" id="result-message"></p>
        <a href="index.html" class="btn btn-primary" style="display:inline-flex;margin-top:0.8rem;padding:0.6rem 1.25rem;">
          Proceed to Sign In &rarr;
        </a>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=2026.8"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      const titleEl = document.getElementById("result-title");
      const msgEl = document.getElementById("result-message");

      if (!token) {
        titleEl.textContent = "Missing Verification Token";
        msgEl.textContent = "The verification link does not include a valid token parameter.";
      } else {
        try {
          await Api.get(`/api/auth/verify-email?token=${encodeURIComponent(token)}`);
          titleEl.textContent = "Account Verified";
          msgEl.textContent = "Your digital credentials have been verified and activated successfully.";
        } catch (err) {
          if (err.code === "ALREADY_VERIFIED") {
            titleEl.textContent = "Already Verified";
            msgEl.textContent = "This account was previously verified. You can sign in immediately.";
          } else {
            titleEl.textContent = "Verification Failed";
            msgEl.textContent = err.message || "This verification link is invalid or has expired.";
          }
        }
      }

      document.getElementById("loading").classList.add("hidden");
      document.getElementById("result").classList.remove("hidden");
    })();
  </script>
</body>
</html>
